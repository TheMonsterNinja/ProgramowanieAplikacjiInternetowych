<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Interaktywne Konto Bankowe</title>
  <style>
    body { font-family: Arial; margin: 30px; }
    .info { margin-top: 10px; font-weight: bold; color: green; }
    .error { color: red; }
  </style>
</head>
<body>

<h2>Konto bankowe – Mateusz</h2>
<p>Saldo: <span id="saldo">1000</span> PLN</p>

<form id="bankForm">
  <label for="amount">Kwota:</label>
  <input type="number" id="amount" required>
  <br><br>
  <button type="button" onclick="handleDeposit()">Wpłać</button>
  <button type="button" onclick="handleWithdraw()">Wypłać</button>
</form>

<div class="info" id="message"></div>

<script>
  let saldo = 1000;

  function updateDisplay() {
    document.getElementById('saldo').innerText = saldo.toFixed(2);
  }

  function handleDeposit() {
    const amount = parseFloat(document.getElementById('amount').value);
    if (amount > 0) {
      saldo += amount;
      showMessage(`Wpłacono ${amount.toFixed(2)} PLN`, false);
    } else {
      showMessage('Podaj poprawną kwotę do wpłaty!', true);
    }
    updateDisplay();
  }

  function handleWithdraw() {
    const amount = parseFloat(document.getElementById('amount').value);
    if (amount > 0 && amount <= saldo) {
      saldo -= amount;
      showMessage(`Wypłacono ${amount.toFixed(2)} PLN`, false);
    } else {
      showMessage('Nieprawidłowa kwota lub brak środków!', true);
    }
    updateDisplay();
  }

  function showMessage(text, isError) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = isError ? 'info error' : 'info';
  }
</script>

</body>
</html>
